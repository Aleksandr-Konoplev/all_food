{% extends 'base.html' %}

{% block title %}Форма пользователя{% endblock %}

{% block content %}
<h1>{% if object %}Редактирование пользователя{% else %}Регистрация пользователя{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
