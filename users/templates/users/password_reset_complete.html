{% extends 'base.html' %}

{% block title %}Пароль обновлен{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="card rounded-4 auth-panel border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
            <span class="text-uppercase small fw-semibold auth-kicker">Готово</span>
            <h1 class="h2 mb-3">Пароль успешно обновлен</h1>
            <p class="text-body-secondary mb-4">Теперь можно войти в личный кабинет с новым паролем.</p>
            <div class="d-flex flex-column flex-sm-row gap-3">
                <a class="btn btn-dark auth-submit-btn" href="{% url 'users:login' %}">Войти в аккаунт</a>
                <a class="btn btn-outline-dark auth-ghost-btn" href="{% url 'users:password-reset' %}">Отправить новую ссылку</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
