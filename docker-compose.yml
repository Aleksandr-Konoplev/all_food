services:
  app:
    build: .
    container_name: app
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - .:/app  # Для локальной разработки
      - static:/app/static
      - media:/app/media
    command: sh -c "python manage.py migrate && python manage.py load_default_data --yes && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:17-alpine
    container_name: db
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  static:
  media:
  postgres_data:

