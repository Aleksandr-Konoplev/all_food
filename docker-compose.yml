services:
  app:
    build: .
    container_name: app
    env_file:
      - .env
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    command: sh -c "python manage.py migrate && python manage.py load_default_data --yes && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:17-alpine
    container_name: db
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - app


volumes:
  static:
  media:
  postgres_data:

